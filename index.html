<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - EduTube</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        #bg-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5); /* Dark overlay for better text readability */
            z-index: -1;
        }
        .card-container {
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
        }
        .google-button {
            transition: all 0.3s ease;
        }
        .google-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px -10px rgba(0, 0, 0, 0.3);
        }
        /* Custom modal styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 100; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto; /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #888;
            width: 80%; /* Could be more or less, depending on screen size */
            max-width: 400px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-black">
    <video autoplay loop muted playsinline id="bg-video">
        <!-- 
            IMPORTANT: Replace the src attribute below with the path to your own video file.
            For example: src="videos/my-background.mp4"
        -->
        <source src="https://wkeo8cvbv1n9mxmr.public.blob.vercel-storage.com/butterfly.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="video-overlay"></div>

    <div class="flex items-center justify-center min-h-screen p-4 relative z-10">
        <div class="w-full max-w-sm mx-auto overflow-hidden text-center">
            
            <div id="signin-card" class="bg-white/20 card-container rounded-2xl shadow-2xl p-8 md:p-10">
                <div class="mb-8">
                    <img src="asimsaad.png" alt="EduTube Logo" class="mx-auto h-16 w-auto mb-4 rounded-lg">
                    <h1 class="text-3xl font-bold text-white">Welcome to ASIMSAADZ</h1>
                    <p class="text-indigo-100 mt-2">Sign in to continue.</p>
                </div>

                <button id="google-signin-btn" 
                   class="google-button w-full inline-flex items-center justify-center bg-white text-gray-700 font-medium py-3 px-4 rounded-lg shadow-lg focus:outline-none focus:ring-4 focus:ring-blue-300">
                    <svg class="w-6 h-6 mr-3" viewBox="0 0 48 48">
                        <path fill="#4285F4" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"></path>
                        <path fill="#34A853" d="M43.611,20.083L43.595,20L42,20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571l0.002-0.002l5.657,5.657C40.074,36.316,44,30.824,44,24C44,22.659,43.862,21.35,43.611,20.083z"></path>
                        <path fill="#FBBC05" d="M10.21,28.641l5.657,5.657C17.93,36.888,20.803,38,24,38c3.197,0,6.07-1.112,8.21-2.9l-5.657-5.657C25.5,29.608,24.789,30,24,30C20.44,30,17.222,28.32,15.25,25.8l-5.04,3.841C11.373,26.425,10.66,27.524,10.21,28.641z"></path>
                        <path fill="#EA4335" d="M24,16c-1.898,0-3.64,0.73-4.95,2.05l-5.657-5.657C15.96,10.193,19.758,8,24,8c5.268,0,10.046,2.053,13.571,6.021l-5.657,5.657C30.151,17.154,27.359,16,24,16z"></path>
                    </svg>
                    Sign in with Google
                </button>

                <div class="text-center text-xs text-indigo-200 mt-8">
                    <p>By signing in, you agree to our</p>
                    <p><a href="#" class="font-medium hover:underline">Terms of Service</a> & <a href="#" class="font-medium hover:underline">Privacy Policy</a>.</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Custom Modal for Messages -->
    <div id="message-modal" class="modal">
      <div class="modal-content">
        <p id="modal-message" class="text-lg font-semibold text-gray-800"></p>
        <button onclick="closeModal()" class="mt-4 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 focus:outline-none">OK</button>
      </div>
    </div>
    
<script type="module">
  // Import Firebase modules
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
  import { 
    getAuth, 
    onAuthStateChanged,
    GoogleAuthProvider, 
    signInWithPopup,
    signOut
  } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
  
  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyD2nIB45KU_b4d7ggIP-ZKDIk82UY1ElJ8",
    authDomain: "asimsaadz-db8a5.firebaseapp.com",
    projectId: "asimsaadz-db8a5",
    storageBucket: "asimsaadz-db8a5.appspot.com",
    messagingSenderId: "201921568991",
    appId: "1:201921568991:web:46e4a57cd2bee11f3bc96a",
    measurementId: "G-P9NDKNYZFL"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  const googleSignInBtn = document.getElementById('google-signin-btn');
  const modal = document.getElementById('message-modal');
  const modalMessage = document.getElementById('modal-message');

  // Define the list of allowed email addresses.
  const allowedEmails = ['mohammadasimsaad@gmail.com', 'mohdasimsaad@gmail.com']; 

  // Function to show the custom modal with a message
  function showModal(message) {
    modalMessage.textContent = message;
    modal.style.display = 'block';
  }

  // Function to close the custom modal
  window.closeModal = function() {
    modal.style.display = 'none';
  }

  // Handle Google Sign-In click
  googleSignInBtn.addEventListener('click', () => {
    signInWithPopup(auth, provider).catch((error) => {
        // Use the custom modal instead of alert for error messages
        showModal('Sign-in error: ' + error.message);
      });
  });

  // Listen for authentication state changes to handle redirects
  onAuthStateChanged(auth, (user) => {
    if (user) {
      // Check if the signed-in user's email is in the allowedEmails array
      if (allowedEmails.includes(user.email)) {
        // If the email is allowed, redirect them to the main page.
        window.location.href = 'asimsaadz.html';
      } else {
        // If the email is NOT allowed, sign them out and show a message.
        signOut(auth).then(() => {
          showModal('Access Denied. Your email is not authorized to view this content.');
        }).catch((error) => {
          console.error('Sign-out error:', error.message);
        });
      }
    } 
    // If user is not signed in, they will remain on this page.
  });
</script>
</body>
</html>
